<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монитор статусов</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 md:p-8 space-y-6">

    <div class="bg-white rounded-2xl shadow-md border border-slate-100 p-6 w-full max-w-xl transition-all">
        <h2 class="text-xl font-bold text-slate-900 mb-1 flex items-center gap-2">
            <span>👤</span> Мой профиль
        </h2>
        <p class="text-slate-500 text-sm mb-5">
            Вы зашли как: <span id="current-user" class="font-semibold text-slate-800 bg-slate-100 px-2 py-0.5 rounded-md">Загрузка...</span>
        </p>
        
        <div class="grid grid-cols-2 gap-3">
            <button onclick="changeStatus('📚 Учусь')" 
                    class="bg-[#1e9242] hover:bg-[#157230] hover:scale-[1.02] active:scale-[0.98] text-white font-medium py-3 px-4 rounded-xl shadow-sm border border-black/5 cursor-pointer transition-all duration-200 flex items-center justify-center gap-2">
                📚 Учусь
            </button>
            <button onclick="changeStatus('☕ Кофе-брейк')" 
                    class="bg-[#ffcc00] hover:bg-[#e6b800] hover:scale-[1.02] active:scale-[0.98] text-black font-medium py-3 px-4 rounded-xl shadow-sm border border-black/5 cursor-pointer transition-all duration-200 flex items-center justify-center gap-2">
                ☕ Кофе
            </button>
            <button onclick="changeStatus('🎮 В игре')" 
                    class="bg-[#179cb3] hover:bg-[#11778a] hover:scale-[1.02] active:scale-[0.98] text-white font-medium py-3 px-4 rounded-xl shadow-sm border border-black/5 cursor-pointer transition-all duration-200 flex items-center justify-center gap-2">
                🎮 В игре
            </button>
            <button onclick="changeStatus('🏠 Дома')" 
                    class="bg-[#64748b] hover:bg-[#475569] hover:scale-[1.02] active:scale-[0.98] text-white font-medium py-3 px-4 rounded-xl shadow-sm border border-black/5 cursor-pointer transition-all duration-200 flex items-center justify-center gap-2">
                🏠 Дома
            </button>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-md border border-slate-100 p-6 w-full max-w-xl transition-all">
        <h2 class="text-xl font-bold text-slate-900 mb-4 flex items-center gap-2">
            <span>📊</span> Монитор группы
        </h2>
        
        <div id="group-container" class="space-y-1 max-h-[400px] overflow-y-auto pr-1">
            <p class="text-slate-400 text-sm animate-pulse">Синхронизация данных участников...</p>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // Параметры подключения к вашему проекту Supabase
        const URL = 'https://drgvmutfbgiaxzwsydjp.supabase.co';
        const KEY = 'sb_publishable_6LrjdAtzkINc2f3OBrmHiA_ML5RRNkx'; 
        const supabase = createClient(URL, KEY);

        // Ваш персональный UUID пользователя в таблице
        const MY_ID = 'c91723ee-846a-459b-9dcf-79f81fdaded6'; 

        // Умный подбор цвета индикатора в зависимости от текста статуса
        function getColorByStatus(status) {
            if (!status) return '#cbd5e1'; // серый цвет по умолчанию (slate-300)
            if (status.includes('Учусь')) return '#1e9242';
            if (status.includes('Кофе')) return '#ffcc00';
            if (status.includes('игр') || status.includes('игре')) return '#179cb3';
            if (status.includes('Дома')) return '#64748b';
            return '#cbd5e1';
        }

        // Функция отправки нового статуса в базу данных
        window.changeStatus = async (text) => {
            const { error } = await supabase
                .from('profiles')
                .update({ status: text })
                .eq('id', MY_ID);

            if (error) {
                alert("Ошибка обновления статуса! Проверьте вкладку Authentication -> Policies для таблицы profiles в Supabase.");
                console.error("Supabase Update Error:", error);
            } else {
                fetchGroup(); 
            }
        };

        // Функция загрузки актуальных данных и рендеринга интерфейса
        async function fetchGroup() {
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .order('username', { ascending: true });

            if (error) {
                console.error("Supabase Fetch Error:", error);
                document.getElementById('group-container').innerHTML = `
                    <div class="p-3 bg-red-50 border border-red-100 rounded-xl text-red-600 text-sm">
                        ⚠️ <strong>Ошибка получения данных.</strong><br>Убедитесь, что для таблицы <strong>profiles</strong> включена RLS политика SELECT (чтение).
                    </div>
                `;
                return;
            }

            const container = document.getElementById('group-container');
            container.innerHTML = ''; 

            let meFound = false;

            data.forEach(profile => {
                const isMe = profile.id === MY_ID;
                if (isMe) {
                    document.getElementById('current-user').innerText = profile.username || "Без имени";
                    meFound = true;
                }

                const dotColor = getColorByStatus(profile.status);
                const userRow = document.createElement('div');
                
                // Стилизация строки пользователя. Если это текущий аккаунт — выделяем мягким фоном
                userRow.className = `flex items-center space-x-3 p-3 rounded-xl transition-colors duration-150 ${
                    isMe ? 'bg-slate-50 border border-slate-100/80 font-medium' : 'hover:bg-slate-50/50'
                }`;
                
                userRow.innerHTML = `
                    <span class="w-3 h-3 rounded-full shrink-0 shadow-xs border border-white" style="background-color: ${dotColor}"></span>
                    <div class="flex-grow min-w-0">
                        <div class="text-sm font-semibold text-slate-900 truncate">
                            ${profile.username || "Без имени"} ${isMe ? '<span class="text-xs text-slate-400 font-normal ml-1">(Вы)</span>' : ''}
                        </div>
                        <div class="text-xs text-slate-500 truncate mt-0.5">
                            ${profile.status || '<span class="text-slate-300 italic">Нет статуса</span>'}
                        </div>
                    </div>
                `;
                container.appendChild(userRow);
            });

            if (!meFound) {
                document.getElementById('current-user').innerHTML = '<span class="text-red-500 font-bold">Ваш ID не найден в базе данных!</span>';
            }
        }

        // Первичный запуск функций при загрузке документа
        fetchGroup();

        // Автоматический опрос базы данных каждые 5 секунд для обновления в реальном времени
        setInterval(fetchGroup, 5000);
    </script>
</body>
</html>
